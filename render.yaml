services:
  - type: web
    # Development branch only: this must stay distinct from the production
    # Blueprint service declared on master.
    name: absolute-equestrian-scheduler-development
    runtime: node
    plan: free
    buildCommand: pnpm install --frozen-lockfile && pnpm prisma:generate && pnpm prisma:migrate:deploy && pnpm build
    startCommand: pnpm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
