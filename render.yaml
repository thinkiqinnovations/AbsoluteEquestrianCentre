services:
  - type: web
    name: absolute-equestrian-scheduler
    runtime: node
    plan: starter
    buildCommand: pnpm install --frozen-lockfile && pnpm prisma:generate && pnpm build
    preDeployCommand: pnpm prisma:migrate:deploy
    startCommand: pnpm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
